name: Mission Lane
description: 'Mission Lane is a consumer fintech founded in 2018 that offers the Mission
  Lane Visa credit card (issued by WebBank) to help millions of Americans with limited
  or rebuilding credit gain access to transparent, fair credit. Operating as a remote-first
  company backed by QED Investors, it combines modern data science and machine-learning
  underwriting with the discipline of an established financial institution, and partners
  with Plaid for open-finance connectivity. Mission Lane provides a mobile app and
  a web account dashboard for cardholders but does not publish a public developer API,
  OpenAPI specification, or partner API program; its engineering surface (BentoML model
  services, MLOps tooling) is internal.'
